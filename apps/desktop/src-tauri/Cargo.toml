repository.workspace = true
description = "Peerly desktop app"

[lib]
name = "peerly_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
peerly-core.workspace = true
